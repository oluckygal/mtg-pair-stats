on: push
jobs:

  test_python:
    runs-on:
      "ubuntu-latest"
    defaults:
      run:
        working-directory:
          "./mts-data"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "mts-data/pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.8"
    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Run tests
      run: uv run pytest
